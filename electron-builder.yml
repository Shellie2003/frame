appId: dev.frame.responsive
productName: Frame
copyright: Copyright © 2026 shellie2003

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Le binaire ne sert à rien sans les assets construits : on échoue tôt si dist/ manque.
asar: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
  maintainer: shellie2003 <shellinopierre@gmail.com>
  synopsis: Cadres multi-appareils pour tester la responsivité des sites web
  desktop:
    entry:
      Name: Frame
      Comment: Test de responsivité multi-appareils

win:
  target:
    - nsis
    - portable
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.png
