name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publier Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire les paquets
        run: npm run dist:win

      - name: Attacher les paquets à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
